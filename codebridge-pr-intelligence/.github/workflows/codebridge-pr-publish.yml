name: CodeBridge PR Comment
on:
  workflow_run:
    workflows: ["CodeBridge PR Verify"]
    types: [completed]
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build trusted publisher
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Download untrusted report artifact (treated strictly as data)
        uses: actions/download-artifact@v4
        with:
          name: codebridge-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: pr-artifact
      - name: Validate report against PR head and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/publish-pr-comment.mjs
