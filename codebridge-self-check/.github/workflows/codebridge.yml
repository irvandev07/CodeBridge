name: CodeBridge CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install developer dependencies
        run: npm install --no-audit --no-fund
      - name: Compile and test
        run: |
          npm run build
          npm run test:run
      - name: Run CodeBridge
        run: node dist/cli/index.js check --base "${{ github.event.pull_request.base.ref || 'main' }}" --format all
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebridge-report
          path: .codebridge/
          if-no-files-found: ignore
