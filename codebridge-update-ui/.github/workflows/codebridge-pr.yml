name: CodeBridge PR Verify
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, build and test (untrusted PR code; no secrets)
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run test:run
      - name: Verify intent
        # Checkout pins HEAD to the real PR head SHA, not the synthetic merge SHA.
        run: node dist/cli/index.js check --base "${{ github.event.pull_request.base.sha }}" --format all
      - name: Upload generated verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebridge-report
          path: .codebridge/
          if-no-files-found: ignore
          retention-days: 7
